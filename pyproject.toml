[project]
name = "llm-architecture"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "bertviz>=1.4.1",
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "jupyter>=1.1.1",
    "kaleido>=1.5.0",
    "matplotlib>=3.11.2",
    "nbclient>=0.11.0",
    "nbconvert>=7.17.2",
    "nbformat>=5.11.1",
    "netron>=9.3.4",
    "networkx>=3.7",
    "numpy>=2.5.4",
    "onnx>=1.23.2",
    "onnxscript>=0.7.2",
    "pandas>=3.1.0",
    "plotly>=7.1.0",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "tokenizers>=0.23.3",
    "torch>=2.15.0",
    "torchinfo>=1.8.0",
    "tqdm>=4.70.1",
    "transformers>=5.22.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llmarch"]
